<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Feliz Dia das Mães</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background:linear-gradient(135deg,#ff4d6d,#ff8fab,#ffc2d1);
}

.container{
    text-align:center;
    position:relative;
}

.titulo{
    font-size:3rem;
    color:white;
    text-shadow:0 0 15px rgba(255,255,255,0.8);
    animation:flutuar 3s ease-in-out infinite;
    letter-spacing:3px;
}

@keyframes flutuar{
    0%{transform:translateY(0px);}
    50%{transform:translateY(-10px);}
    100%{transform:translateY(0px);}
}

.rosas{
    animation:girar 5s linear infinite;
    display:inline-block;
}

@keyframes girar{
    100%{
        transform:rotate(360deg);
    }
}

.botao{
    margin-top:30px;
    padding:15px 35px;
    border:none;
    border-radius:50px;
    background:white;
    color:#ff4d6d;
    font-size:1.1rem;
    cursor:pointer;
    transition:0.3s;
    box-shadow:0 0 20px rgba(255,255,255,0.5);
}

.botao:hover{
    transform:scale(1.1);
    background:#ffe5ec;
}

.mensagem{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%) scale(0.7);
    
    width:85%;
    max-width:500px;

    padding:30px;
    border-radius:25px;

    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(20px);

    color:white;
    font-size:1.3rem;
    line-height:1.7;

    opacity:0;
    visibility:hidden;

    transition:
        opacity 0.8s ease,
        transform 0.8s ease,
        filter 0.8s ease;

    filter:blur(25px);
    box-shadow:0 0 40px rgba(255,255,255,0.2);
}

.mensagem.ativa{
    opacity:1;
    visibility:visible;
    transform:translate(-50%,-50%) scale(1);
    filter:blur(0px);
}

.hearts{
    position:absolute;
    width:100%;
    height:100%;
    overflow:hidden;
    top:0;
    left:0;
    pointer-events:none;
}

.heart{
    position:absolute;
    bottom:-50px;
    color:white;
    font-size:25px;
    animation:subir linear infinite;
    opacity:0.7;
}

@keyframes subir{
    0%{
        transform:translateY(0) scale(1);
        opacity:0;
    }

    50%{
        opacity:1;
    }

    100%{
        transform:translateY(-120vh) scale(1.5);
        opacity:0;
    }
}
</style>
</head>

<body>

<div class="hearts"></div>

<div class="container">

    <h1 class="titulo">
        <span class="rosas">🌹</span>
        FELIZ DIA DAS MAES
        <span class="rosas">🌹</span>
    </h1>

    <button class="botao" onclick="mostrarMensagem()">
        Mostrar Mensagem 💖
    </button>

</div>

<div class="mensagem" id="mensagem">
    Mãe, você é a luz que ilumina todos os dias,
    a força que nunca desiste e o amor mais puro
    que existe no mundo. 💖<br><br>

    Feliz Dia das Mães 🌹
</div>

<script>

function mostrarMensagem(){
    document.getElementById("mensagem")
    .classList.toggle("ativa");
}

function criarCoracoes(){

    const hearts = document.querySelector(".hearts");

    const heart = document.createElement("div");

    heart.classList.add("heart");

    heart.innerHTML = "💖";

    heart.style.left = Math.random() * 100 + "vw";

    heart.style.animationDuration =
    (Math.random() * 3 + 4) + "s";

    heart.style.fontSize =
    (Math.random() * 20 + 20) + "px";

    hearts.appendChild(heart);

    setTimeout(()=>{
        heart.remove();
    },7000);
}

setInterval(criarCoracoes,300);

</script>

</body>
</html>
